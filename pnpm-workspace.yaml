packages:
  - "packages/*"
  - "examples/*"

autoInstallPeers: false
minimumReleaseAge: 1440
overrides:
  # GHSA-7589-6fvf-x4pw (High, CVSS 8.7): ReDoS in effect <3.22.1 via @prisma/config.
  "effect": "^3.22.1"
  # GHSA-3g3m-2fjr-6pw4 (Medium, CWE-400): AbortSignal cancellation bypass in glob <=14.0.1 via testcontainers -> archiver-utils.
  "glob": "^14.0.2"
  # GHSA-g3hv-75wg-m249 (Medium, CWE-405): DoS via globparts amplification in minimatch <11.0.1 via @microsoft/api-extractor and glob.
  "minimatch": "^11.0.1"
allowBuilds:
  "@prisma/engines": false
  "cpu-features": false
  "prisma": false
  "protobufjs": false
  "ssh2": false

catalog:
  "@arethetypeswrong/cli": "^0.18.5"
  "@biomejs/biome": "^2.6.8"
  "@hono/node-server": "2.1.11"
  "@microsoft/api-extractor": "^7.60.1"
  "@neondatabase/serverless": "1.2.1"
  "@prisma/adapter-neon": "7.10.1"
  "@prisma/adapter-pg": "7.10.1"
  "@prisma/client": "7.10.1"
  "@prisma/sqlcommenter": "7.10.1"
  "@testcontainers/postgresql": "^12.2.2"
  "@types/express": "^5.0.6"
  "@types/node": "^22.20.5"
  "@types/pg": "8.23.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@vitest/coverage-v8": "^5.1.1"
  "ajv": "^8.17.1"
  "ajv-formats": "^3.0.1"
  "drizzle-orm": "0.45.4"
  "drizzle-orm-v1": "npm:drizzle-orm@1.0.0-rc.6"
  "express": "^5.3.0"
  "fast-check": "^4.11.0"
  "hono": "4.13.20"
  "next": "16.4.6"
  "pg": "8.23.1"
