name: Bug report
description: Report a bug in @auditstream/node, @auditstream/prisma or @auditstream/drizzle
type: Bug
labels:
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear summary of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal TypeScript snippet or test case reproducing the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package versions, Node/Bun/Deno/Workers runtime, ORM/driver versions, and Postgres/pooler setup.
      placeholder: |
        - Packages: @auditstream/node 0.1.0, @auditstream/prisma 0.1.0
        - Runtime: Node 22.23
        - ORM/driver: @prisma/client 7.10.1, pg 8.23.1
        - Postgres/pooler: PostgreSQL 16.15 behind PgBouncer 1.26
    validations:
      required: true
