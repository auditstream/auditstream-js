name: Feature request
description: Propose a new feature or adapter improvement in auditstream-js
type: Feature
labels:
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        If this feature changes the actor schema, SQL transport or history format, file a Spec change in `auditstream/auditstream` first.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve, and which adapter or runtime needs it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired API or adapter behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you considered.
    validations:
      required: false
