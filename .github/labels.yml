# Repository labels for auditstream/auditstream-js (13 handbook labels).
# Synced by .github/workflows/labels.yml without deleting any other label.

- name: "area:node"
  color: "1d76db"
  description: "@auditstream/node"

- name: "area:prisma"
  color: "1d76db"
  description: "@auditstream/prisma"

- name: "area:drizzle"
  color: "1d76db"
  description: "@auditstream/drizzle"

- name: "area:ci"
  color: "c5def5"
  description: "CI, build and release tooling"

- name: "area:docs"
  color: "c5def5"
  description: "Documentation, guides and examples"

- name: "status:needs-triage"
  color: "fbca04"
