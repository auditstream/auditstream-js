name: Security audit

on:
  push:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
      - "osv-scanner.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "osv-scanner.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CLI mode while private; switch to osv-scanner-reusable.yml with upload-sarif: true in #49.
      - name: Scan pnpm-lock.yaml with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
