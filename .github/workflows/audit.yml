name: Security audit

on:
  push:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
      - "osv-scanner.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "osv-scanner.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  osv-scanner:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # Fork PRs receive a read-only GITHUB_TOKEN that cannot upload SARIF.
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      fail-on-vuln: true
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
