name: Check PR body

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-disclosure:
    permissions:
      pull-requests: read
    uses: auditstream/.github/.github/workflows/reusable-pr-body.yml@a175503e97a978c4444faecc5cf258e3766529e2 # v1.0.0
