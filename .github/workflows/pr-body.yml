name: Check PR body

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-disclosure:
    permissions:
      pull-requests: read
    uses: auditstream/.github/.github/workflows/reusable-pr-body.yml@85d9a13ddc78591528d7b59db8138b1c0864e2d5 # main
