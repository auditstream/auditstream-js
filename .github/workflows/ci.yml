name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      readme: ${{ steps.filter.outputs.readme }}
    steps:
      - name: Detect changed file categories
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "readme=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! files=$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename'); then
            echo "Failed to list PR files; defaulting to code=true."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "readme=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ]; then
            echo "PR file count ($count) outside fast-path bounds; defaulting to code=true."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "readme=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          readme=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              README.md|packages/*/README.md)
                readme=true
                ;;
              docs/*|AGENTS.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|LICENSE|CHANGELOG.md|packages/*/CHANGELOG.md|.changeset/*.md|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md|.github/labels.yml)
                ;;
              *)
                code=true
                break
                ;;
            esac
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "readme=$readme" >> "$GITHUB_OUTPUT"
          echo "Detected code=$code readme=$readme across $count changed file(s)."

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.readme == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm api:check
      - run: pnpm check:packages
      - run: pnpm check:readme

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run test --affected
          else
            pnpm exec turbo run test
          fi

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "26"
            pg: "15"
          - node: "26"
            pg: "16"
          - node: "26"
            pg: "17"
          - node: "26"
            pg: "18"
          - node: "26"
            pg: "19"
          - node: "22"
            pg: "18"
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run Postgres and PgBouncer integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          pnpm --filter @auditstream/test-utils test:integration
          pnpm --filter @auditstream/node test:integration
          pnpm --filter @auditstream/drizzle test:integration
          pnpm --filter @auditstream/prisma test:integration

  smoke-runtimes:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Smoke test Bun
        run: bun scripts/smoke-runtimes.mjs
      - name: Smoke test Deno
        run: deno run --allow-read --allow-env scripts/smoke-runtimes.mjs

  test-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test:smoke

  typescript-7:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Typecheck with TypeScript 7.0 (non-blocking)
        run: >-
          pnpm --package=typescript@^7.0.2 dlx sh -c
          'set -e; for pkg in packages/*/tsconfig.json; do echo "==> ts7 check $pkg"; tsc --noEmit -p "$pkg"; done'

  ci-ok:
    if: always()
    needs:
      - changes
      - checks
      - test
      - integration
      - smoke-runtimes
      - test-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all blocking CI jobs succeeded
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          README_CHANGED: ${{ needs.changes.outputs.readme }}
        run: |
          node - <<'EOF'
          const needs = JSON.parse(process.env.RESULTS_JSON || "{}");
          const codeChanged = process.env.CODE_CHANGED === "true";
          const readmeChanged = process.env.README_CHANGED === "true";
          if (needs.changes?.result !== "success") {
            console.error(`Blocking job 'changes' finished with result: ${needs.changes?.result}`);
            process.exit(1);
          }
          const checksAllowed = codeChanged || readmeChanged
            ? new Set(["success"])
            : new Set(["success", "skipped"]);
          const codeAllowed = codeChanged
            ? new Set(["success"])
            : new Set(["success", "skipped"]);

          const failed = [];
          for (const [name, info] of Object.entries(needs)) {
            if (name === "changes") continue;
            const allowed = name === "checks" ? checksAllowed : codeAllowed;
            if (!allowed.has(info.result)) {
              failed.push([name, info]);
            }
          }
          if (failed.length > 0) {
            for (const [name, info] of failed) {
              console.error(`Blocking job '${name}' finished with result: ${info.result}`);
            }
            process.exit(1);
          }
          console.log(`All ${Object.keys(needs).length} blocking CI jobs passed (code=${codeChanged}, readme=${readmeChanged}).`);
          EOF
