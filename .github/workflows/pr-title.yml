name: Check PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: auditstream/.github/.github/workflows/reusable-pr-title.yml@85d9a13ddc78591528d7b59db8138b1c0864e2d5 # main
    with:
      scopes: "node|prisma|drizzle|docs|ci|deps"
