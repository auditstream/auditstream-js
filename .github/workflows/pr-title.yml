name: Check PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    permissions:
      pull-requests: read
    uses: auditstream/.github/.github/workflows/reusable-pr-title.yml@a175503e97a978c4444faecc5cf258e3766529e2 # v1.0.0
    with:
      scopes: "node|prisma|drizzle|docs|ci|deps"
