name: Check PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commits title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node - <<'EOF'
          const title = process.env.PR_TITLE || "";
          const pattern =
            /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\((node|prisma|drizzle|docs|ci|deps)\))?!?: \S.*$/;

          if (!pattern.test(title)) {
            console.error(`Invalid PR title: "${title}"`);
            console.error(
              "Expected Conventional Commits 1.0: <type>[(<scope>)][!]: <description>",
            );
            console.error(
              "Allowed types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert, style",
            );
            console.error(
              "Allowed scopes (optional): node, prisma, drizzle, docs, ci, deps",
            );
            process.exit(1);
          }

          console.log(`PR title valid: ${title}`);
          EOF
