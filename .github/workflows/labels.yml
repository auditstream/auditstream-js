name: Sync labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync labels from .github/labels.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          yq -o=json '.' .github/labels.yml | jq -c '.[]' | while IFS= read -r item; do
            name=$(jq -r '.name' <<< "$item")
            color=$(jq -r '.color' <<< "$item")
            description=$(jq -r '.description' <<< "$item")
            gh label create "$name" \
              --repo "$GH_REPO" \
              --color "$color" \
              --description "$description" \
              --force
          done
