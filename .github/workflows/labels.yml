name: Sync labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    permissions:
      contents: read
      issues: write
    uses: auditstream/.github/.github/workflows/reusable-labels.yml@a175503e97a978c4444faecc5cf258e3766529e2 # v1.0.0
